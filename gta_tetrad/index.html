<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
const W = 1920, H = 1080, FPS = 24, N = 720, DUR = N / FPS;
const out = document.getElementById("c"), octx = out.getContext("2d");
const mk = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; return c; };
const cA = mk(), cB = mk(), cS = mk(), cU = mk();
const aCtx = cA.getContext("2d"), bCtx = cB.getContext("2d"), sCtx = cS.getContext("2d"), uCtx = cU.getContext("2d");

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const sm = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const smr = (t, a, b) => sm((t - a) / (b - a));
const easeOutBack = k => { k = clamp(k); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const easeOutCubic = k => 1 - Math.pow(1 - clamp(k), 3);
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function rng(seed) { let s = seed >>> 0 || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; }
function monotone(keys) {
  const n = keys.length, xs = keys.map(k => k[0]), ys = keys.map(k => k[1]);
  const d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = (d[i - 1] * d[i] <= 0) ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const tt = 3 / Math.sqrt(s); m[i] = tt * a * d[i]; m[i + 1] = tt * b * d[i]; }
  }
  return x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0; while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], k = (x - xs[i]) / h, k2 = k * k, k3 = k2 * k;
    return (2 * k3 - 3 * k2 + 1) * ys[i] + (k3 - 2 * k2 + k) * h * m[i] + (-2 * k3 + 3 * k2) * ys[i + 1] + (k3 - k2) * h * m[i + 1];
  };
}
function keyLerp(keys, t) { // keys: [t, ...values], linear
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (t <= b[0]) { const k = (t - a[0]) / (b[0] - a[0]); return a.slice(1).map((v, j) => lerp(v, b[j + 1], k)); }
  }
  return keys[keys.length - 1].slice(1);
}

// ---------- story timing (120 BPM; beats every 0.5 s) ----------
const T = {
  notice: 0.95, hop: 2.3, go: 3.0, penIn: 3.6, pops: [5.0, 6.0, 11.0],
  eq0: 8.55, eq1: 10.25, strikes: [12.5, 13.5, 14.5], dodge: [-1, 1, -1],
  jump0: 16.0, jump1: 17.0, stop: 17.5, out: 17.55, hide: 18.0,
  search: 18.6, noticeBlot: 20.6, raise0: 21.6, turn0: 23.0, turn1: 24.1,
  q0: 24.7, q1: 25.2, cap: 25.5, logo: 26.4, peel0: 27.0, peel1: 28.6
};
T.stars = T.pops.map(p => p - 0.14);
const LANE = 620, RAMP0 = 13500, RAMP1 = 13740, MARGIN = 13850, SPINE = 14300, LAND = 14650;
const BLOT = { x: 15510, y: 575, r: 175 };
const QX = 15560, QY = 690;
const EQ = { x: 6400, y: 930 };
const carGroundX = monotone([[0, 900], [3.0, 900], [3.5, 1180], [8.5, 6300], [11.5, 9400], [15.5, 13200], [16.0, RAMP1], [17.0, LAND], [17.25, 14830], [17.5, 14900], [40, 14900]]);
function jumpU(t) { const v = clamp((t - T.jump0) / (T.jump1 - T.jump0)); return v + 0.62 * Math.sin(2 * Math.PI * v) / (2 * Math.PI); }
function laneY(x) { return LANE + 38 * Math.sin(x / 260) * smr(x, 1200, 1700) * (1 - smr(x, RAMP0 - 450, RAMP0 - 60)); }
function dodgeShape(t, s) { return smr(t, s - 0.26, s - 0.03) * (1 - smr(t, s + 0.25, s + 0.8)); }
function dodgeY(t) { let y = 0; T.strikes.forEach((s, i) => y += T.dodge[i] * 160 * dodgeShape(t, s)); return y; }
function car(t) {
  let x = carGroundX(t), arc = 0, rot = 0, scl = 1;
  const inJump = t > T.jump0 && t < T.jump1;
  if (inJump) {
    const u = jumpU(t); x = lerp(RAMP1, LAND, u); arc = 70 * (1 - u) + 400 * 4 * u * (1 - u);
    rot = -0.26 * (1 - 2 * u); scl = 1 + 0.55 * 4 * u * (1 - u);
  } else if (t < T.jump0 && x > RAMP0) { const k = clamp((x - RAMP0) / (RAMP1 - RAMP0)); arc = 70 * k; rot = -0.28 * smr(k, 0, 0.12); }
  let y = laneY(x) - arc + dodgeY(t);
  if (!inJump && x < RAMP0) { const s = (laneY(x + 5) - laneY(x - 5)) / 10; rot += Math.atan(s); rot += (dodgeY(t + 0.02) - dodgeY(t - 0.02)) / 0.04 * 0.00035; }
  let sq = 0;
  if (t >= T.jump1) { const k = t - T.jump1; sq = 0.28 * Math.exp(-k * 9) * Math.cos(k * 32); rot += 0.08 * Math.exp(-k * 7) * Math.sin(k * 26); }
  if (t >= T.hop + 0.25 && t < T.hop + 0.8) { const k = t - T.hop - 0.25; sq += 0.22 * Math.exp(-k * 10) * Math.cos(k * 30); }
  if (t > 2.6 && t < T.go) { x += 3 * Math.sin(t * 90); rot += 0.012 * Math.sin(t * 70); sq += 0.03 * Math.sin(t * 60); } // revving
  if (t > T.stop - 0.25 && t < T.stop + 0.5) { const k = t - (T.stop - 0.05); if (k > -0.2) rot += 0.07 * Math.exp(-Math.abs(k) * 8) * Math.sin(k * 25 + 0.5); }
  const v = (carGroundX(t + 0.01) - carGroundX(t - 0.01)) / 0.02;
  return { x, y, rot, scl, sq, arc, v };
}

// ---------- pen (precomputed path; it leaves ink wherever h ~ 0) ----------
function follow(t, lag) { const x = carGroundX(Math.max(t - lag, 0)); return [x, laneY(x) + 8 + 22 * Math.sin(t * 9)]; }
const QPTS = (() => {
  const p = []; for (let i = 0; i <= 40; i++) { const a = Math.PI * 1.15 - i / 40 * Math.PI * 1.6; p.push([62 * Math.cos(a), -150 - 62 * Math.sin(a)]); }
  const last = p[p.length - 1]; p.push([last[0] - 10, last[1] + 40]); p.push([0, -30]); p.push([0, 10]);
  return p;
})();
function qPath(k) { k = clamp(k); const f = k * (QPTS.length - 1), i = Math.floor(f), r = f - i; const a = QPTS[i], b = QPTS[Math.min(i + 1, QPTS.length - 1)]; return [lerp(a[0], b[0], r), lerp(a[1], b[1], r)]; }
let EQK = null;
function penRaw(t) {
  let x, y, h = 0, ang = -2.45 + 0.12 * Math.sin(t * 5.3);
  if (t < T.eq0) {
    [x, y] = follow(t, 0.5);
    x -= 700 * (1 - easeOutCubic((t - T.penIn) / 0.55));
    h = 300 * (1 - smr(t, T.penIn - 0.25, T.penIn + 0.02));
  } else if (t < T.eq1) {
    if (!EQK) {
      const f = follow(T.eq0, 0.5), X = EQ.x, Y = EQ.y;
      EQK = [[T.eq0, f[0], f[1], 0], [8.75, X + 305, Y - 62, 45], [8.8, X + 305, Y - 62, 0], [8.95, X + 372, Y + 6, 0], [9.0, X + 372, Y + 6, 30], [9.05, X + 372, Y - 62, 30], [9.08, X + 372, Y - 62, 0], [9.22, X + 305, Y + 6, 0], [9.28, X + 305, Y + 6, 45],
        [9.36, X + 358, Y - 165, 45], [9.4, X + 358, Y - 165, 0], [9.52, X + 322, Y - 105, 0], [9.62, X + 378, Y - 105, 0], [9.66, X + 378, Y - 105, 35], [9.72, X + 360, Y - 140, 35], [9.75, X + 360, Y - 140, 0], [9.88, X + 360, Y - 80, 0], [9.92, X + 360, Y - 80, 35],
        [9.98, X + 420, Y - 50, 35], [10.0, X + 420, Y - 50, 0], [10.06, X + 440, Y - 25, 0], [10.18, X + 490, Y - 90, 0], [T.eq1, X + 490, Y - 90, 60]];
    }
    [x, y, h] = keyLerp(EQK, t);
    ang = -2.35 + 0.18 * Math.sin(t * 23);
  } else if (t < T.search) {
    const f = follow(t, 0.45), b = sm(smr(t, T.eq1, 11.7));
    const e = EQK[EQK.length - 1];
    x = lerp(e[1], f[0], b); y = lerp(e[2], f[1], b); h = 60 * (1 - smr(t, T.eq1, T.eq1 + 0.25));
    ang = -2.5 + 0.12 * Math.sin(t * 7);
    T.strikes.forEach((s, i) => {
      if (t > s - 0.55 && t < s + 0.45) {
        const tx = carGroundX(s), ty = laneY(tx);
        const k = smr(t, s - 0.55, s - 0.08) * (1 - smr(t, s + 0.15, s + 0.45));
        x = lerp(x, tx - 40, k); y = lerp(y, ty, k);
        h += 190 * Math.sin(Math.PI * clamp((t - (s - 0.55)) / 0.52)) * (t < s - 0.03 ? 1 : 0);
        if (t > s - 0.03 && t < s + 0.14) { const q = (t - s + 0.03) / 0.17; x += 70 * q; y += 45 * q; } // slash mark
        if (t >= s + 0.14) h += 70 * Math.sin(Math.PI * clamp((t - s - 0.14) / 0.31));
        ang += 0.35 * Math.sin(Math.PI * clamp((t - (s - 0.55)) / 0.7));
      }
    });
  } else {
    const f = follow(t, 0.45), k = t - T.search;
    let sx = lerp(14900, 15160, smr(t, T.search, T.search + 0.3));
    const still = 1 - smr(t, T.noticeBlot - 0.1, T.noticeBlot + 0.1);
    sx += 70 * Math.sin(k * 7.5) * smr(t, T.search + 0.2, T.search + 0.5) * still;
    let sy = LANE - 10 + 60 * Math.sin(k * 4.3 + 1) * still;
    let sh = 40 + 10 * Math.sin(k * 11) * still, sa = -2.4 + 0.5 * Math.sin(k * 6.2) * still;
    // noticed the blot: creep closer, then wind up a stab
    const ap = smr(t, 20.8, T.raise0);
    sx = lerp(sx, 15300, ap); sy = lerp(sy, 585, ap); sa = lerp(sa, -2.2, ap);
    const r = smr(t, T.raise0, 22.9);
    sh += 260 * r + 6 * Math.sin(t * 60) * r; sx -= 60 * r; sa -= 0.25 * r;
    const bl = smr(t, T.search, T.search + 0.4);
    x = lerp(f[0], sx, bl); y = lerp(f[1], sy, bl); h = lerp(0, sh, bl); ang = lerp(ang, sa, bl);
    if (t > T.turn0) { const j = smr(t, T.turn0, T.turn0 + 0.35); h += 200 * j; x -= 120 * j; y -= 160 * j; ang = lerp(ang, -2.0, j); }
    if (t > 23.9) {
      const d = smr(t, 23.9, T.q0), qp = qPath((t - T.q0) / (T.q1 - T.q0));
      x = lerp(x, QX + qp[0], d); y = lerp(y, QY + qp[1], d); h = lerp(h, 0, d); ang = lerp(ang, -2.3, d);
      if (t > T.q1 + 0.03) {
        const e = smr(t, 25.6, 26.3);
        h += 30 * smr(t, T.q1, T.q1 + 0.15) + 400 * e; x -= 900 * e * e; y -= 700 * e * e;
        ang += 0.35 * Math.sin((t - T.q1) * 14) * (1 - e);
      }
    }
  }
  // star flicks (the pen "signs" each wanted star)
  for (const s of T.stars) { const k = (t - s + 0.05) / 0.3; if (k > 0 && k < 1) { h += 26 * Math.sin(Math.PI * k); ang += 0.25 * Math.sin(2 * Math.PI * k); } }
  if (t < T.penIn - 0.3) { x = -9999; h = 400; }
  return [x, y, h, ang];
}
const PR = 240;
const PEN = (() => { const a = []; for (let i = 0; i <= DUR * PR + 10; i++) a.push(penRaw(i / PR)); return a; })();
function pen(t) {
  const f = clamp(t * PR, 0, PEN.length - 1), i = Math.floor(f), r = f - i, a = PEN[i], b = PEN[Math.min(i + 1, PEN.length - 1)];
  const v = a.map((q, j) => lerp(q, b[j], r));
  return { x: v[0], y: v[1], h: v[2], ang: v[3], down: v[2] < 3 && v[0] > -9000 };
}

// ---------- camera (spring-smoothed, precomputed) ----------
function strikeSig(t) { let s = 0; T.strikes.forEach((x, i) => s += T.dodge[i] * dodgeShape(t, x)); return s; }
function camTarget(t) {
  const c = car(t);
  if (t < T.go) return [lerp(760, 880, smr(t, 0, 2.9)), 470, lerp(1.6, 1.32, smr(t, 0, 2.6)), lerp(-0.1, -0.02, smr(t, 0, 2.6))];
  if (t < T.eq0 + 0.05) { const px = carGroundX(Math.max(t - 0.5, 0)); return [(c.x + px) / 2 + 40, 545, lerp(1.32, 1.18, smr(t, 3, 3.8)), 0.035 * Math.sin(t * 2.1)]; }
  if (t < T.eq1) return [EQ.x + 330, 800, 1.42, 0.05];
  if (t < 15.4) { const px = pen(t).x, wc = t < 12.0 ? lerp(0.85, 0.5, smr(t, 11.2, 12.0)) : 0.5; return [c.x * wc + px * (1 - wc) + 40, 560, t < 11.9 ? 1.1 : 1.26, 0.035 * Math.sin(t * 2.1) + 0.07 * strikeSig(t)]; }
  if (t < T.stop) { const a = c.arc / 400; return [c.x + 60, c.y - 40, lerp(1.12, 0.86, sm(a * 1.6)), -0.13 * sm(a * 1.4)]; }
  if (t < T.turn0) return [15420, 560, lerp(1.16, 1.34, smr(t, 21.2, 23.0)), lerp(0.025, -0.03, smr(t, 21.2, 23))];
  return [QX, 650, lerp(1.16, 1.3, smr(t, 24, 30)), lerp(0.025, -0.02, smr(t, 24, 30))];
}
const CAM = (() => {
  const steps = Math.ceil(DUR * 240) + 10, arr = [];
  let p = camTarget(0).slice(), v = [0, 0, 0, 0];
  const w = [7, 6, 5, 6];
  for (let i = 0; i <= steps; i++) {
    const t = i / 240, g = camTarget(t), dt = 1 / 240;
    for (let j = 0; j < 4; j++) { const a = w[j] * w[j] * (g[j] - p[j]) - 2 * w[j] * v[j]; v[j] += a * dt; p[j] += v[j] * dt; }
    arr.push(p.slice());
  }
  return arr;
})();
function cam(t) {
  const f = clamp(t * 240, 0, CAM.length - 1), i = Math.floor(f), r = f - i, a = CAM[i], b = CAM[Math.min(i + 1, CAM.length - 1)];
  const c = a.map((x, j) => lerp(x, b[j], r));
  c[0] += 6 * Math.sin(t * 1.7) + 3 * Math.sin(t * 3.9); c[1] += 5 * Math.sin(t * 1.3 + 1);
  const shake = (at, amp) => { if (t > at) { const k = t - at; c[1] += amp * Math.exp(-k * 8) * Math.sin(k * 45); c[0] += amp * 0.6 * Math.exp(-k * 8) * Math.sin(k * 37); } };
  shake(T.jump1, 22); T.strikes.forEach(s => shake(s, 14)); shake(T.eq0 + 0.1, 8);
  return { x: c[0], y: c[1], z: c[2], r: c[3] };
}
function applyCam(ctx, C) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.translate(W / 2, H / 2); ctx.rotate(C.r); ctx.scale(C.z, C.z); ctx.translate(-C.x, -C.y); }

// ---------- paper ----------
let paperPat = null, backPat = null;
function makePaper(tint) {
  const c = document.createElement("canvas"); c.width = c.height = 512; const x = c.getContext("2d");
  x.fillStyle = tint; x.fillRect(0, 0, 512, 512);
  const r = rng(tint.length * 99 + 7), img = x.getImageData(0, 0, 512, 512), d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 10; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  x.putImageData(img, 0, 0);
  x.globalAlpha = 0.05; x.strokeStyle = "#776"; x.lineWidth = 0.7;
  for (let i = 0; i < 140; i++) { const a = r() * 6.28, px = r() * 512, py = r() * 512, l = 6 + r() * 18; x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke(); }
  return c;
}
let BOIL = 0;
function jit(seed, amp) { return (hash(seed + BOIL * 17.31) - 0.5) * 2 * amp; }
function wline(ctx, pts, amp = 1.6, seed = 1, closed = false) {
  ctx.beginPath();
  const P = pts.map((p, i) => [p[0] + jit(seed + i * 3.1, amp), p[1] + jit(seed + i * 5.7 + 2, amp)]);
  if (closed) P.push(P[0], P[1]);
  ctx.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length - 1; i++) { const mx = (P[i][0] + P[i + 1][0]) / 2, my = (P[i][1] + P[i + 1][1]) / 2; ctx.quadraticCurveTo(P[i][0], P[i][1], mx, my); }
  if (!closed) ctx.lineTo(P[P.length - 1][0], P[P.length - 1][1]);
  ctx.stroke();
}
function circPts(cx, cy, r, n = 14, ry) { const p = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * (ry || r)]); } return p; }
const GRAPHITE = "rgba(48,48,56,0.92)", PENCIL2 = "rgba(48,48,56,0.7)", BALL = "#2340a8", RED = "#d3202c";

function drawPaper(ctx, C, opts = {}) {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#3a2a20"; ctx.fillRect(0, 0, W, H);
  applyCam(ctx, C);
  ctx.fillStyle = ctx.createPattern(paperPat, "repeat"); ctx.fillRect(-900, -1500, 18000, 3600);
  const R = 1400 / C.z, bx0 = C.x - R, bx1 = C.x + R, by0 = C.y - R, by1 = C.y + R;
  ctx.strokeStyle = "rgba(70,130,200,0.32)"; ctx.lineWidth = 1.6; ctx.beginPath();
  const g = 48;
  for (let x = Math.floor(bx0 / g) * g; x < bx1; x += g) { ctx.moveTo(x, by0); ctx.lineTo(x, by1); }
  for (let y = Math.floor(by0 / g) * g; y < by1; y += g) { ctx.moveTo(bx0, y); ctx.lineTo(bx1, y); }
  ctx.stroke();
  ctx.strokeStyle = "rgba(220,40,60,0.85)"; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(MARGIN, by0); ctx.lineTo(MARGIN, by1); ctx.stroke();
  const sg = ctx.createLinearGradient(SPINE - 60, 0, SPINE + 90, 0);
  sg.addColorStop(0, "rgba(0,0,0,0)"); sg.addColorStop(0.42, "rgba(60,40,20,0.22)"); sg.addColorStop(0.5, "rgba(40,25,10,0.34)"); sg.addColorStop(0.6, "rgba(60,40,20,0.16)"); sg.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = sg; ctx.fillRect(SPINE - 60, by0, 150, by1 - by0);
  ctx.fillStyle = "rgba(150,150,160,0.9)"; for (const sy of [-200, 1300]) ctx.fillRect(SPINE - 3, sy, 6, 120);
  ctx.restore();
}
function drawText(ctx, s, x, y, font, color, rot = 0, alpha = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.font = font; ctx.fillStyle = color; ctx.globalAlpha = alpha; ctx.fillText(s, 0, 0); ctx.restore();
}

// ---------- characters ----------
function stickman(ctx, x, y, pose, seed, scale = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(scale * (pose.flip || 1), scale);
  ctx.strokeStyle = GRAPHITE; ctx.lineWidth = 7; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const ph = pose.run || 0, amp = pose.runAmp || 0, cr = pose.crouch || 0;
  const hip = [0, -78 + cr], neck = [6 * amp + (pose.lean || 0), -140 + cr * 1.4];
  const head = [neck[0] + 4 * amp + (pose.lean || 0) * 0.4, neck[1] - 30];

  let sx = 0, sy = 0; T.strikes.forEach(s => { if (t > s && t < s + 0.4) { const k = t - s; sx += 10 * Math.exp(-k * 10) * Math.sin(k * 80); sy += 8 * Math.exp(-k * 10) * Math.cos(k * 70); } });
  for (let i = 0; i < 3; i++) {
    const ts = T.stars[i], k = clamp((t - ts + 0.12) / 0.26); if (k <= 0) continue;
    const cx = W - 420 + i * 132 + sx, cy = 118 + sy;
    let alpha = 1;
    if (t > T.search && t < T.turn0) alpha = (Math.floor((t - T.search) / 0.2) % 2) ? 0.25 : 1;
    const pp = i === 2 ? 0.7 : 0.35;
    const pop = 1 + pp * Math.exp(-(t - ts - 0.14) * 9) * (t > ts + 0.14 ? 1 : 0);
    ctx.save(); ctx.globalAlpha = alpha; ctx.translate(cx, cy); ctx.scale(pop, pop); ctx.translate(-cx, -cy);

    ctx.strokeStyle = RED; ctx.lineWidth = 7; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let j = 1; j <= Math.floor(f); j++) ctx.lineTo(pts[j][0], pts[j][1]);
    const j = Math.floor(f); if (j < 10) { const r = f - j; ctx.lineTo(lerp(pts[j][0], pts[j + 1][0], r), lerp(pts[j][1], pts[j + 1][1], r)); }
    ctx.stroke();
    if (k >= 1) {
      ctx.save(); ctx.beginPath(); pts.forEach((p, q) => q ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.clip();
      ctx.lineWidth = 6; const fk = clamp((t - ts - 0.14) / 0.12);
      for (let y = cy - 56; y < cy - 56 + 112 * fk; y += 9) { ctx.beginPath(); ctx.moveTo(cx - 60, y); ctx.lineTo(cx + 60, y + 6); ctx.stroke(); }
      ctx.restore();
    }
    ctx.restore();
  }
}

// ---------- new page ----------
function drawNewWorld(ctx, t, C) {
  drawPaper(ctx, C);
  applyCam(ctx, C);
  drawText(ctx, "November 27th", QX - 620, 330, "400 74px Caveat", BALL, -0.015, 0.9);
  drawText(ctx, "Homework", QX - 470, 416, "400 74px Caveat", BALL, -0.01, 0.9);
  inkTrail(ctx, T.q0 - 0.05, Math.min(t, T.q1 + 0.03));
  if (t > T.q1) { ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(QX, QY + 18, 9 * smr(t, T.q1, T.q1 + 0.05), 0, 7); ctx.fill(); }
  if (t > T.cap) {
    const k = smr(t, T.cap, T.cap + 0.7);
    ctx.save(); ctx.font = "700 128px Caveat"; const s = "Wanted level: cleared.", w = ctx.measureText(s).width;
    const x = QX - w / 2, y = 920;
    ctx.beginPath(); ctx.rect(x - 20, y - 200, (w + 40) * k, 280); ctx.clip();
    ctx.fillStyle = BALL; ctx.translate(x, y); ctx.rotate(-0.02); ctx.fillText(s, 0, 0); ctx.restore();
    const k2 = smr(t, T.logo, T.logo + 0.3);
    if (k2 > 0) { ctx.save(); ctx.globalAlpha = k2; ctx.font = "44px RubikMono"; ctx.fillStyle = "rgba(42,42,50,0.9)"; const s2 = "GTA: NOTEBOOK"; const w2 = ctx.measureText(s2).width; ctx.translate(QX - w2 / 2, 1000 + 20 * (1 - k2)); ctx.fillText(s2, 0, 0); ctx.restore(); }
  }
}
// what is under the corner of the new page: our hero, waving goodbye
function drawUnder(ctx, t, C) {
  drawPaper(ctx, C);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.save(); ctx.translate(W - 165, H - 30); ctx.scale(C.z * 0.78, C.z * 0.78);
  // half of the car peeking in
  ctx.save(); ctx.translate(250, 0); drawCar(ctx, { x: 0, y: 0, rot: 0, scl: 1, sq: 0, arc: 0, v: 0 }, t, false); ctx.restore();
  stickman(ctx, 0, 0, { wave: t * 16, look: -0.5, smile: true }, 530);
  ctx.restore();
}

// ---------- objects above the paper ----------
function drawPen(ctx, t, C) {
  const p = pen(t);
  if (p.x < -9000) return;
  applyCam(ctx, C);
  const L = 600, Wd = 50, dir = [Math.cos(p.ang), Math.sin(p.ang)], nrm = [-dir[1], dir[0]];
  ctx.save(); ctx.filter = `blur(${6 + p.h / 18}px)`; ctx.fillStyle = `rgba(20,15,10,${Math.max(0.05, 0.26 - p.h / 2500)})`;
  const off = (s) => [p.x + dir[0] * s + 0.18 * s + p.h * 0.55, p.y + dir[1] * s + 0.3 * s + p.h * 0.8];
  const a = off(0), b = off(L);
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0] + nrm[0] * Wd / 2, b[1] + nrm[1] * Wd / 2); ctx.lineTo(b[0] - nrm[0] * Wd / 2, b[1] - nrm[1] * Wd / 2); ctx.closePath(); ctx.fill();
  ctx.restore();
  const lift = 1 + p.h / 2200;
  ctx.save(); ctx.translate(p.x - p.h * 0.05, p.y - p.h * 0.12); ctx.scale(lift, lift); ctx.rotate(p.ang);
  ctx.fillStyle = "#c9c9cf"; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(40, -12); ctx.lineTo(40, 12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(1, 0, 4, 0, 7); ctx.fill();
  const cyl = (x0, x1, c0, c1, c2) => { const g = ctx.createLinearGradient(0, -Wd / 2, 0, Wd / 2); g.addColorStop(0, c0); g.addColorStop(0.32, c1); g.addColorStop(0.5, c2); g.addColorStop(1, c0); ctx.fillStyle = g; ctx.fillRect(x0, -Wd / 2, x1 - x0, Wd); };
  ctx.fillStyle = "#e8e8ee"; ctx.beginPath(); ctx.moveTo(40, -12); ctx.lineTo(95, -Wd / 2); ctx.lineTo(95, Wd / 2); ctx.lineTo(40, 12); ctx.fill();
  cyl(95, 230, "#7a0d14", "#e23a44", "#ff9aa0");
  ctx.strokeStyle = "rgba(90,0,10,0.5)"; ctx.lineWidth = 3; for (let x = 105; x < 225; x += 12) { ctx.beginPath(); ctx.moveTo(x, -Wd / 2); ctx.lineTo(x, Wd / 2); ctx.stroke(); }
  cyl(230, L - 60, "#8a1219", "#d8262f", "#ff7b82");
  ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fillRect(250, -Wd / 2 + 9, L - 330, 4);
  ctx.save(); ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.font = "700 22px Inter"; ctx.fillText("GRADED", 320, 8); ctx.restore();
  cyl(L - 60, L, "#333", "#777", "#bbb");
  ctx.fillStyle = "#9aa"; ctx.fillRect(L - 150, -Wd / 2 - 8, 130, 10);
  ctx.restore();
  // angry puffs while correcting the math
  if (t > 9.2 && t < 10.4) { ctx.strokeStyle = "rgba(90,90,100,0.6)"; ctx.lineWidth = 4; for (let i = 0; i < 3; i++) { const k = ((t - 9.2) * 1.6 + i / 3) % 1; const ex = p.x + dir[0] * 560 + 30 * k * (i - 1), ey = p.y + dir[1] * 560 - 120 * k; ctx.globalAlpha = 1 - k; wline(ctx, circPts(ex, ey, 8 + 14 * k, 8), 1, 700 + i, true); } ctx.globalAlpha = 1; }
  if (t > T.penIn - 0.3 && t < T.turn0 + 0.3) {
    const end = [p.x - p.h * 0.05 + dir[0] * (L - 20) * lift, p.y - p.h * 0.12 + dir[1] * (L - 20) * lift];
    const phase = Math.floor(t / 0.16) % 2, col = phase ? "255,40,50" : "40,90,255";
    const g = ctx.createRadialGradient(end[0], end[1], 0, end[0], end[1], 260);
    g.addColorStop(0, `rgba(${col},0.85)`); g.addColorStop(0.15, `rgba(${col},0.35)`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = smr(t, T.penIn - 0.2, T.penIn + 0.2) * (1 - smr(t, T.turn0, T.turn0 + 0.3));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(end[0], end[1], 260, 0, 7); ctx.fill(); ctx.restore();
  }
}
function drawForeground(ctx, t, C) {
  const fg = (wx, wy, f, fn, blur) => {
    const dx = (wx - C.x) * C.z * f, dy = (wy - C.y) * C.z * f;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.translate(W / 2 + dx, H / 2 + dy); ctx.rotate(C.r); ctx.scale(C.z * f, C.z * f);
    ctx.save(); ctx.filter = `blur(${blur}px)`; fn(); ctx.restore();
  };
  if (t > 4.0 && t < 7.5) fg(5000, 1010, 1.75, () => {
    ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fillRect(-140, -50, 300, 130);
    ctx.fillStyle = "#f08aa0"; ctx.fillRect(-150, -70, 300, 120); ctx.fillStyle = "#5a7bd8"; ctx.fillRect(40, -70, 110, 120);
    ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.fillRect(-150, -70, 300, 18);
  }, 14);
  if (t > 11.5 && t < 15.5) fg(12200, 130, 1.7, () => { // ruler
    ctx.rotate(-0.12); ctx.fillStyle = "rgba(210,230,240,0.75)"; ctx.fillRect(-700, -55, 1400, 110);
    ctx.fillStyle = "rgba(40,60,80,0.7)"; for (let i = -690; i < 700; i += 24) ctx.fillRect(i, -55, 3, i % 120 === 0 ? 40 : 22);
  }, 12);
  if (t > 15.4 && t < 18.3) fg(14200, 900, 1.8, () => {
    ctx.rotate(-0.22);
    ctx.fillStyle = "#f2c230"; ctx.fillRect(-420, -30, 760, 60); ctx.fillStyle = "#d9a520"; ctx.fillRect(-420, 8, 760, 22);
    ctx.fillStyle = "#e9c9a0"; ctx.beginPath(); ctx.moveTo(340, -30); ctx.lineTo(450, 0); ctx.lineTo(340, 30); ctx.fill();
    ctx.fillStyle = "#333"; ctx.beginPath(); ctx.moveTo(420, -9); ctx.lineTo(450, 0); ctx.lineTo(420, 9); ctx.fill();
    ctx.fillStyle = "#c0c0c8"; ctx.fillRect(-470, -31, 60, 62); ctx.fillStyle = "#e88"; ctx.fillRect(-520, -30, 50, 60);
  }, 16);
}

// ---------- page fold: top sheet curls from corner C towards P ----------
function fold(ctx, top, under, Cx, Cy, Px, Py) {
  let ux = Cx - Px, uy = Cy - Py; const ul = Math.hypot(ux, uy) || 1; ux /= ul; uy /= ul;
  const Mx = (Cx + Px) / 2, My = (Cy + Py) / 2, vx = -uy, vy = ux, Lg = 6000;
  const half = (sgn) => { ctx.beginPath(); ctx.moveTo(Mx + vx * Lg, My + vy * Lg); ctx.lineTo(Mx - vx * Lg, My - vy * Lg); ctx.lineTo(Mx - vx * Lg + sgn * ux * Lg, My - vy * Lg + sgn * uy * Lg); ctx.lineTo(Mx + vx * Lg + sgn * ux * Lg, My + vy * Lg + sgn * uy * Lg); ctx.closePath(); };
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(under, 0, 0);
  ctx.save(); half(1); ctx.clip();
  let g = ctx.createLinearGradient(Mx, My, Mx + ux * 260, My + uy * 260); g.addColorStop(0, "rgba(30,20,10,0.38)"); g.addColorStop(1, "rgba(30,20,10,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.save(); half(-1); ctx.clip(); ctx.drawImage(top, 0, 0);
  g = ctx.createLinearGradient(Mx, My, Mx - ux * 220, My - uy * 220); g.addColorStop(0, "rgba(20,10,0,0.0)"); g.addColorStop(0.15, "rgba(20,10,0,0.35)"); g.addColorStop(1, "rgba(20,10,0,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  const d = Mx * ux + My * uy;
  ctx.save(); half(-1); ctx.clip();
  ctx.transform(1 - 2 * ux * ux, -2 * ux * uy, -2 * ux * uy, 1 - 2 * uy * uy, 2 * d * ux, 2 * d * uy);
  half(1); ctx.clip(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.fillStyle = ctx.createPattern(backPat, "repeat"); ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.13; ctx.drawImage(top, 0, 0); ctx.globalAlpha = 1;
  g = ctx.createLinearGradient(Mx, My, Mx + ux * 900, My + uy * 900);
  g.addColorStop(0, "rgba(90,70,40,0.35)"); g.addColorStop(0.08, "rgba(255,255,255,0.18)"); g.addColorStop(0.4, "rgba(0,0,0,0.0)"); g.addColorStop(1, "rgba(60,40,20,0.18)");
  ctx.fillStyle = g; ctx.fillRect(-W, -H, 3 * W, 3 * H);
  ctx.restore();
  ctx.save(); ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(Mx + vx * Lg, My + vy * Lg); ctx.lineTo(Mx - vx * Lg, My - vy * Lg); ctx.stroke(); ctx.restore();
}
function composite(ctx, t, C) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (t < T.turn0) { drawOldWorld(aCtx, t, C); drawHUD(aCtx, t); ctx.drawImage(cA, 0, 0); return; }
  drawNewWorld(bCtx, t, C);
  if (t < T.turn1) {
    drawOldWorld(aCtx, t, C); drawHUD(aCtx, t);
    const p = clamp((t - T.turn0) / (T.turn1 - T.turn0)), e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    const Cx = W + 40, Cy = H + 40;
    fold(ctx, cA, cB, Cx, Cy, lerp(Cx - 10, -W * 1.35, e), lerp(Cy - 10, H * 0.25, e) - 260 * Math.sin(Math.PI * e));
    return;
  }
  if (t > T.peel0 && t < T.peel1) {
    drawUnder(uCtx, t, C);
    let e = 0;
    if (t < 27.35) e = easeOutBack((t - T.peel0) / 0.35) ; else if (t < 28.35) e = 1 + 0.02 * Math.sin((t - 27.35) * 9); else e = 1 - Math.pow(clamp((t - 28.35) / 0.2), 2);
    const Cx = W + 20, Cy = H + 20;
    fold(ctx, cB, cU, Cx, Cy, lerp(Cx - 2, W - 470, e), lerp(Cy - 2, H - 400, e));
    return;
  }
  ctx.drawImage(cB, 0, 0);
}
function grade(ctx, t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = ctx.createRadialGradient(W * 0.3, H * 0.2, 100, W * 0.5, H * 0.5, W * 0.75);
  g.addColorStop(0, "rgba(255,240,200,0.10)"); g.addColorStop(0.6, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(30,15,0,0.38)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const s = smr(t, T.penIn + 0.1, T.penIn + 0.5) * (1 - smr(t, T.turn0 - 0.2, T.turn0 + 0.1));
  if (s > 0) { const ph = Math.floor(t / 0.16) % 2; ctx.fillStyle = ph ? `rgba(255,30,40,${0.045 * s})` : `rgba(30,80,255,${0.045 * s})`; ctx.fillRect(0, 0, W, H); }
  // fade from black at the very start
  if (t < 0.25) { ctx.fillStyle = `rgba(0,0,0,${1 - t / 0.25})`; ctx.fillRect(0, 0, W, H); }
}
function renderAt(ctx, t) {
  BOIL = Math.floor(t * 12);
  const C = cam(t);
  composite(ctx, t, C);
  drawPen(ctx, t, C);
  drawForeground(ctx, t, C);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = "none";
  grade(ctx, t);
}
const SUB = 4;
function renderFrame(i) {
  const t0 = i / FPS;
  octx.setTransform(1, 0, 0, 1, 0, 0); octx.globalAlpha = 1;
  for (let s = 0; s < SUB; s++) {
    const t = t0 + (s / SUB - 0.5) * 0.5 / FPS;
    sCtx.setTransform(1, 0, 0, 1, 0, 0); sCtx.globalAlpha = 1; sCtx.filter = "none";
    renderAt(sCtx, Math.max(0, t));
    octx.globalAlpha = 1 / (s + 1); octx.drawImage(cS, 0, 0);
  }
  octx.globalAlpha = 1;
}
window.renderFrame = renderFrame;
window.ready = (async () => {
  await Promise.all(["400 40px Caveat", "700 40px Caveat", "40px RubikMono", "700 20px Inter"].map(f => document.fonts.load(f, "AaGTA?")));
  paperPat = makePaper("#f7f4ea"); backPat = makePaper("#efe9da");
  return true;
})();
window.ready.then(() => {
  if (location.hash === "#render") return;
  const t0 = performance.now();
  const loop = () => { const i = Math.floor(((performance.now() - t0) / 1000 * FPS)) % N; renderFrame(i); requestAnimationFrame(loop); };
  loop();
});
</script>
